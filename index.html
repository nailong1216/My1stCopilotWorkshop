<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <p class="eyebrow">DAILY FOCUS</p>
      <h1>待辦清單</h1>
      <p class="subtitle">整理今天要完成的每一件事</p>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="visually-hidden" for="todo-input">新增待辦事項</label>
      <input id="todo-input" type="text" placeholder="今天想完成什麼？" autocomplete="off" maxlength="120">
      <button type="submit">新增</button>
    </form>

    <section class="todo-section" aria-labelledby="list-heading">
      <h2 id="list-heading" class="visually-hidden">待辦事項列表</h2>
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-state" id="empty-state">還沒有任何待辦事項，新增一個吧!</p>
    </section>

    <footer class="todo-footer">
      <span id="remaining-count">未完成：0 項</span>
    </footer>
  </main>
</body>
</html>
